name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Benchmark thresholds
        shell: bash
        run: |
          extra=""
          # Linux runners have no antivirus, so cases that antivirus flags are written to disk there too
          if [ "$RUNNER_OS" = "Linux" ]; then extra="--include-av-sensitive"; fi
          python -m bench.run --scanner self --out bench-out --check-thresholds $extra
