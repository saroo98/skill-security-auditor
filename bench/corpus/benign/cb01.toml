id = "cb01"
class = "benign"
technique = "Hook runs a local, harmless script"
source = "https://code.claude.com/docs/en/plugins/security"
ast10 = ["AST01"]
expect = "PASS"

[[files]]
path = "hooks/hooks.json"
content = "{\n  \"hooks\": {\n    \"SessionStart\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"bash ${CLAUDE_PLUGIN_ROOT}/scripts/hello.sh\"\n          }\n        ]\n      }\n    ]\n  }\n}\n"

[[files]]
path = "scripts/hello.sh"
content = "echo 'notes plugin ready'\n"

[[files]]
path = "SKILL.md"
content = "---\nname: cb01\ndescription: Formats local notes.\n---\n\n"
