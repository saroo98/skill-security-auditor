<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">skill-security-auditor card</title>
  <desc id="desc">Square dark repository card for skill-security-auditor with shield, code panels, and audit indicators.</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071015"/>
      <stop offset="0.52" stop-color="#0A1218"/>
      <stop offset="1" stop-color="#0D1821"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="58%" r="48%">
      <stop offset="0" stop-color="#28D7D3" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#28D7D3" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#28D7D3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142636"/>
      <stop offset="1" stop-color="#101D27"/>
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#203849"/>
      <stop offset="0.48" stop-color="#172735"/>
      <stop offset="1" stop-color="#0B151D"/>
    </linearGradient>
    <pattern id="gridPattern" width="86" height="86" patternUnits="userSpaceOnUse">
      <path d="M 86 0 L 0 0 0 86" fill="none" stroke="#223746" stroke-width="1" opacity="0.22"/>
      <path d="M 0 86 L 86 0" fill="none" stroke="#223746" stroke-width="1" opacity="0.13"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font { font-family: Inter, ui-sans-serif, "Segoe UI", Arial, sans-serif; }
      .title { fill: #F2F6F8; font-size: 76px; font-weight: 760; letter-spacing: -1px; }
      .eyebrow { fill: #28D7D3; font-size: 25px; font-weight: 640; letter-spacing: 9px; }
      .subtitle { fill: #9BAABA; font-size: 34px; font-weight: 420; }
      .panel { fill: url(#panelGradient); stroke: #315064; stroke-width: 2.1; }
      .code-line { stroke: #315064; stroke-width: 6.5; stroke-linecap: round; opacity: 0.76; }
      .code-line-accent { stroke: #28D7D3; stroke-width: 6.5; stroke-linecap: round; opacity: 0.78; }
    </style>
  </defs>

  <g id="background">
    <rect width="1024" height="1024" rx="0" fill="url(#bgGradient)"/>
    <rect width="1024" height="1024" fill="url(#cyanGlow)"/>
    <rect x="54" y="54" width="916" height="916" rx="42" fill="none" stroke="#315064" stroke-width="2" opacity="0.55"/>
  </g>

  <g id="grid">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#gridPattern)" opacity="0.28"/>
    <circle cx="512" cy="630" r="276" fill="none" stroke="#315064" stroke-width="1.3" opacity="0.28"/>
    <circle cx="512" cy="630" r="212" fill="none" stroke="#28D7D3" stroke-width="1" opacity="0.18"/>
    <circle cx="512" cy="630" r="150" fill="none" stroke="#315064" stroke-width="1" opacity="0.24"/>
    <path d="M512 330 V900" stroke="#315064" stroke-width="1" opacity="0.2"/>
    <path d="M225 630 H800" stroke="#315064" stroke-width="1" opacity="0.22"/>
    <g fill="#28D7D3" opacity="0.28">
      <circle cx="270" cy="522" r="2.3"/>
      <circle cx="296" cy="522" r="2.3"/>
      <circle cx="322" cy="522" r="2.3"/>
      <circle cx="348" cy="522" r="2.3"/>
      <circle cx="270" cy="548" r="2.3"/>
      <circle cx="296" cy="548" r="2.3"/>
      <circle cx="322" cy="548" r="2.3"/>
      <circle cx="348" cy="548" r="2.3"/>
      <circle cx="676" cy="522" r="2.3"/>
      <circle cx="702" cy="522" r="2.3"/>
      <circle cx="728" cy="522" r="2.3"/>
      <circle cx="754" cy="522" r="2.3"/>
      <circle cx="676" cy="548" r="2.3"/>
      <circle cx="702" cy="548" r="2.3"/>
      <circle cx="728" cy="548" r="2.3"/>
      <circle cx="754" cy="548" r="2.3"/>
    </g>
  </g>

  <g id="content" class="font">
    <rect x="394" y="128" width="7" height="32" rx="3.5" fill="#28D7D3" filter="url(#softGlow)"/>
    <text x="424" y="150" class="eyebrow">CODEX SKILL</text>
    <text x="512" y="270" text-anchor="middle" class="title">skill-security-auditor</text>
    <line x1="462" y1="355" x2="562" y2="355" stroke="#28D7D3" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>
    <text x="512" y="420" text-anchor="middle" class="subtitle">Audit skill supply-chain risk.</text>
  </g>

  <g id="security-illustration">
    <g opacity="0.82">
      <rect x="420" y="488" width="246" height="276" rx="14" class="panel"/>
      <path d="M610 488 L666 544 L666 488 Z" fill="#1B3142" stroke="#315064" stroke-width="2"/>
      <path d="M474 568 H558" class="code-line-accent"/>
      <path d="M474 608 H604" class="code-line"/>
      <path d="M474 648 H584" class="code-line"/>
      <path d="M474 688 H626" class="code-line"/>
      <path d="M474 728 H532" class="code-line-accent"/>
    </g>

    <g opacity="0.72">
      <rect x="242" y="576" width="292" height="260" rx="15" class="panel"/>
      <rect x="242" y="576" width="292" height="52" rx="15" fill="#182B3A" opacity="0.95"/>
      <circle cx="270" cy="602" r="6" fill="#7F9BB0" opacity="0.82"/>
      <circle cx="296" cy="602" r="6" fill="#7F9BB0" opacity="0.62"/>
      <circle cx="322" cy="602" r="6" fill="#7F9BB0" opacity="0.46"/>
      <path d="M294 680 H332" class="code-line-accent"/>
      <path d="M346 680 H466" class="code-line"/>
      <path d="M294 720 H386" class="code-line-accent"/>
      <path d="M400 720 H486" class="code-line"/>
      <path d="M294 760 H354" class="code-line"/>
      <path d="M368 760 H456" class="code-line-accent"/>
    </g>

    <g opacity="0.76">
      <rect x="608" y="598" width="246" height="220" rx="14" class="panel"/>
      <path d="M664 660 H780" class="code-line"/>
      <path d="M664 704 H810" class="code-line"/>
      <path d="M664 748 H768" class="code-line-accent"/>
      <circle cx="828" cy="660" r="22" fill="#0D1821" stroke="#28D7D3" stroke-width="3"/>
      <path d="M817 660 L826 669 L841 650" fill="none" stroke="#28D7D3" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M828 702 L850 744 H806 Z" fill="#0D1821" stroke="#28D7D3" stroke-width="3" stroke-linejoin="round"/>
      <path d="M828 718 V731" stroke="#28D7D3" stroke-width="4" stroke-linecap="round"/>
      <circle cx="828" cy="738" r="2.8" fill="#28D7D3"/>
      <circle cx="828" cy="792" r="22" fill="#0D1821" stroke="#28D7D3" stroke-width="3"/>
      <path d="M817 792 L826 801 L841 782" fill="none" stroke="#28D7D3" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="shield" filter="url(#softGlow)">
      <path d="M512 648 C560 620 600 612 648 642 L648 730 C648 810 596 868 512 908 C428 868 376 810 376 730 L376 642 C424 612 464 620 512 648 Z" fill="url(#shieldGradient)" stroke="#28D7D3" stroke-width="3"/>
      <path d="M512 666 L614 704 L614 732 C614 790 578 830 512 864 Z" fill="#071015" opacity="0.34"/>
      <path d="M456 764 L494 802 L574 706" fill="none" stroke="#28D7D3" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="audit-indicators" filter="url(#softGlow)">
      <path d="M648 668 H806" stroke="#28D7D3" stroke-width="2.4" opacity="0.58"/>
      <path d="M648 748 H806" stroke="#28D7D3" stroke-width="2.4" opacity="0.58"/>
      <path d="M648 808 H806" stroke="#28D7D3" stroke-width="2.4" opacity="0.58"/>
      <circle cx="806" cy="668" r="7" fill="#28D7D3"/>
      <circle cx="806" cy="748" r="7" fill="#28D7D3"/>
      <circle cx="806" cy="808" r="7" fill="#28D7D3"/>
    </g>
  </g>
</svg>
