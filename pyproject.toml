[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-security-auditor"
version = "0.9.1"
description = "Check agent skills before installing them: quarantine, static checks, verdict, pinned install."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = []
dependencies = []
keywords = [
  "agent-skill",
  "codex-skill",
  "claude-code",
  "ai-agent-security",
  "supply-chain-security",
  "static-analysis",
]

[project.scripts]
skillaudit = "skillaudit.cli:main"

[tool.setuptools.package-data]
skillaudit = ["*.txt"]

[tool.setuptools.packages.find]
where = ["skills/securityauditor/scripts"]
include = ["skillaudit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
